<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herramientas de Ciberseguridad</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen font-sans text-gray-800">

    <form action="http://localhost:8000/procesar" method="POST" enctype="multipart/form-data" class="w-96 bg-white p-8 rounded-xl shadow-2xl flex flex-col gap-6">
        
        <h1 class="text-2xl font-bold text-center text-blue-700 border-b pb-4">Panel de Análisis</h1>

        <div>
            <h2 class="text-lg font-semibold mb-3 text-gray-700">1. Selecciona el Análisis</h2>
            <div class="flex flex-col gap-3 bg-gray-50 p-4 rounded-lg border border-gray-200">
                <label class="flex items-center gap-3 cursor-pointer hover:bg-gray-100 p-1 rounded">
                    <input type="radio" name="tipoAnalisis" value="vulnerabilidades" class="w-5 h-5 text-blue-600" checked>
                    <span class="font-medium">Análisis de vulnerabilidades web</span>
                </label>
                
                <label class="flex items-center gap-3 cursor-pointer hover:bg-gray-100 p-1 rounded">
                    <input type="radio" name="tipoAnalisis" value="cve" class="w-5 h-5 text-blue-600">
                    <span class="font-medium">CVEs</span>
                </label>
                
                <label class="flex items-center gap-3 cursor-pointer hover:bg-gray-100 p-1 rounded">
                    <input type="radio" name="tipoAnalisis" value="ping" class="w-5 h-5 text-blue-600">
                    <span class="font-medium">Ver si la página está operativa</span>
                </label>
            </div>
        </div>

        <div>
            <h2 class="text-lg font-semibold mb-3 text-gray-700">2. Sube tus Datos (.csv)</h2>
            <input 
                type="file" 
                name="archivoCsv"
                accept=".csv"
                required
                class="block w-full text-sm text-gray-500
                       file:mr-4 file:py-2 file:px-4
                       file:rounded-md file:border-0
                       file:text-sm file:font-bold
                       file:bg-blue-50 file:text-blue-700
                       hover:file:bg-blue-100 cursor-pointer border border-gray-200 rounded-md p-1"
            >
        </div>

        <button 
            type="submit"
            class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-md w-full"
        >
            Procesar Datos
        </button>
    </form>

</body>
</html>
